<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alterar Senha | Magia Glass Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/design-system.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="logo">
        <img src="../assets/images/logo-insta.jpeg" alt="" style="height:40px;border-radius:8px;">
        <div class="logo-text" style="color:white;">MAGIA GLASS<span style="color:rgba(255,255,255,0.6);">ADMIN</span></div>
      </div>
            <nav class="admin-nav">
        <a href="dashboard.html">📊 Dashboard</a>
        <a href="home.html">🏠 Editar Home</a>
        <a href="services.html">🛠️ Serviços</a>
        <a href="gallery.html">🖼️ Galeria</a>
        <a href="marketing.html">📢 Marketing</a>
        <a href="settings.html">⚙️ Configurações</a>
        <a href="password.html">🔑 Alterar Senha</a>
        <a href="../index.html" target="_blank">🌐 Ver Site</a>
        <a href="#" onclick="logout(); location.href='index.html';">🚪 Sair</a>
      </nav>
    </aside>
    <main class="admin-main">
      <div class="admin-header">
        <h1 style="font-family:var(--font-display);" class="active">Alterar Senha</h1>
      </div>
      <div class="admin-card" style="max-width:420px;">
        <form id="pass-form">
          <div class="form-group">
            <label>Senha atual</label>
            <input type="password" id="old-pass" class="form-control" required>
          </div>
          <div class="form-group">
            <label>Nova senha</label>
            <input type="password" id="new-pass" class="form-control" required minlength="6">
          </div>
          <div class="form-group">
            <label>Confirmar nova senha</label>
            <input type="password" id="confirm-pass" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-primary" class="active">Alterar Senha</button>
        </form>
      </div>
    </main>
  </div>
  <script src="../assets/js/data.js"></script>
  <script>
    if (!isAuthenticated()) location.href = 'index.html';
    document.getElementById('pass-form').addEventListener('submit', e => {
      e.preventDefault();
      const oldP = document.getElementById('old-pass').value;
      const newP = document.getElementById('new-pass').value;
      const conf = document.getElementById('confirm-pass').value;
      if (newP !== conf) {
        alert('As senhas não coincidem.');
        return;
      }
      if (changePassword(oldP, newP)) {
        alert('Senha alterada com sucesso!');
        document.getElementById('pass-form').reset();
      } else {
        alert('Senha atual incorreta.');
      }
    });
  </script>
</body>
</html>
