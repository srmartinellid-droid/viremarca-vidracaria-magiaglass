<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Serviços | Magia Glass Admin</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../assets/css/design-system.css"><style>.svc-cover-preview{width:100%;max-width:320px;aspect-ratio:16/10;object-fit:cover;border-radius:12px;border:1px solid rgba(30,106,158,0.15);background:#f1f5f9;display:block}.svc-cover-actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem}.svc-thumb{width:64px;height:40px;object-fit:cover;border-radius:6px;background:#e2e8f0;vertical-align:middle}</style></head>
<body><div class="admin-layout"><aside class="admin-sidebar"><div class="logo"><img src="../assets/images/logo-insta.jpeg" alt="" style="height:40px;border-radius:8px;"><div class="logo-text" style="color:white;">MAGIA GLASS<span style="color:rgba(255,255,255,0.6);">ADMIN</span></div></div><nav class="admin-nav"><a href="dashboard.html">📊 Dashboard</a><a href="home.html">🏠 Editar Home</a><a href="services.html" class="active">🛠️ Serviços</a><a href="gallery.html">🖼️ Galeria</a><a href="marketing.html">📢 Marketing</a><a href="settings.html">⚙️ Configurações</a><a href="password.html">🔑 Alterar Senha</a><a href="../index.html" target="_blank">🌐 Ver Site</a><a href="#" onclick="logout(); location.href='index.html';">🚪 Sair</a></nav></aside>
<main class="admin-main"><div class="admin-header"><h1 style="font-family:var(--font-display);">Gerenciar Serviços</h1><button class="btn btn-primary btn-sm" onclick="showForm()">+ Novo Serviço</button></div>
<div class="admin-card" id="form-card" style="display:none;"><h3 id="form-title">Novo Serviço</h3><form id="service-form"><input type="hidden" id="service-id"><input type="hidden" id="s-image"><div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;"><div class="form-group"><label>Título</label><input type="text" id="s-title" class="form-control" required></div><div class="form-group"><label>Categoria</label><input type="text" id="s-category" class="form-control" required placeholder="Ex: Banheiro"></div></div><div class="form-group"><label>Descrição</label><textarea id="s-description" class="form-control" rows="3" required></textarea></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem;"><div class="form-group"><label>Ícone (emoji)</label><input type="text" id="s-icon" class="form-control" value="✨"></div><div class="form-group"><label>Ordem</label><input type="number" id="s-order" class="form-control" value="1"></div><div class="form-group"><label>Destaque na Home</label><select id="s-featured" class="form-control"><option value="true">Sim</option><option value="false">Não</option></select></div></div><div class="form-group"><label>Imagem de capa</label><div id="s-image-preview-wrap" style="display:none;margin-bottom:.5rem;"><img id="s-image-preview" class="svc-cover-preview" alt="Capa"><div class="svc-cover-actions"><button type="button" class="btn btn-sm btn-outline" onclick="clearServiceImage()">Excluir imagem</button></div></div><input type="file" id="s-image-file" class="form-control" accept="image/*"><p style="font-size:.8rem;color:var(--gray-600);margin-top:.35rem;">JPG/PNG recomendado. Proporção 16:10.</p></div><div style="display:flex;gap:.75rem;"><button type="submit" class="btn btn-primary">Salvar</button><button type="button" class="btn btn-secondary" onclick="hideForm()">Cancelar</button></div></form></div>
<div class="admin-card"><table class="table"><thead><tr><th>Capa</th><th>Ícone</th><th>Título</th><th>Categoria</th><th>Destaque</th><th>Ações</th></tr></thead><tbody id="services-table"></tbody></table></div></main></div>
<script src="../assets/js/data.js"></script><script>
if (!isAuthenticated()) location.href='index.html';
function load(){const list=getData(STORAGE_KEYS.services,DEFAULT_SERVICES).sort((a,b)=>a.order-b.order);document.getElementById('services-table').innerHTML=list.map(s=>`<tr><td>${s.image?'<img class="svc-thumb" src="'+s.image+'" alt="">':'<span style="color:var(--gray-400);font-size:.8rem;">Sem capa</span>'}</td><td style="font-size:1.4rem;">${s.icon||''}</td><td><strong>${s.title}</strong></td><td><span class="badge badge-info">${s.category}</span></td><td>${s.featured?'✅':'—'}</td><td><button class="btn btn-sm btn-secondary" onclick='editService(${JSON.stringify(s).replace(/'/g,"&#39;")})'>Editar</button><button class="btn btn-sm btn-outline" onclick="deleteService('${s.id}')">Excluir</button></td></tr>`).join('');}
function showImagePreview(src){const wrap=document.getElementById('s-image-preview-wrap'),img=document.getElementById('s-image-preview');if(src){img.src=src;wrap.style.display='block'}else{img.src='';wrap.style.display='none'}}
function clearServiceImage(){document.getElementById('s-image').value='';document.getElementById('s-image-file').value='';showImagePreview('')}
document.getElementById('s-image-file').addEventListener('change',function(e){const file=e.target.files&&e.target.files[0];if(!file)return;if(file.size>2.5*1024*1024){alert('Imagem muito grande. Use até ~2,5 MB.');e.target.value='';return}const reader=new FileReader();reader.onload=function(){document.getElementById('s-image').value=reader.result;showImagePreview(reader.result)};reader.readAsDataURL(file)});
function showForm(){document.getElementById('form-card').style.display='block';document.getElementById('form-title').textContent='Novo Serviço';document.getElementById('service-form').reset();document.getElementById('service-id').value='';document.getElementById('s-image').value='';showImagePreview('')}
function hideForm(){document.getElementById('form-card').style.display='none'}
function editService(s){showForm();document.getElementById('form-title').textContent='Editar Serviço';document.getElementById('service-id').value=s.id;document.getElementById('s-title').value=s.title;document.getElementById('s-category').value=s.category;document.getElementById('s-description').value=s.description;document.getElementById('s-icon').value=s.icon||'✨';document.getElementById('s-order').value=s.order;document.getElementById('s-featured').value=String(s.featured);document.getElementById('s-image').value=s.image||'';showImagePreview(s.image||'')}
function deleteService(id){if(!confirm('Excluir este serviço?'))return;let list=getData(STORAGE_KEYS.services,[]);list=list.filter(s=>s.id!==id);if(!setData(STORAGE_KEYS.services,list))return;load()}
document.getElementById('service-form').addEventListener('submit',e=>{e.preventDefault();let list=getData(STORAGE_KEYS.services,[]);const id=document.getElementById('service-id').value||('s'+Date.now());const item={id,title:document.getElementById('s-title').value,category:document.getElementById('s-category').value,description:document.getElementById('s-description').value,icon:document.getElementById('s-icon').value||'✨',order:parseInt(document.getElementById('s-order').value)||1,featured:document.getElementById('s-featured').value==='true',image:document.getElementById('s-image').value||''};const idx=list.findIndex(s=>s.id===id);if(idx>=0)list[idx]=item;else list.push(item);if(!setData(STORAGE_KEYS.services,list))return;hideForm();load();alert('Serviço salvo!')});load();
</script></body></html>
