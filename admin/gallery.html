<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galeria | Magia Glass Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/design-system.css">
  <style>
    body.gallery-modal-open { overflow: hidden; }
    body.gallery-modal-open::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(15, 39, 68, 0.58);
      backdrop-filter: blur(2px);
      z-index: 900;
    }
    #form-card.gallery-modal {
      position: fixed;
      inset: 50% auto auto 50%;
      transform: translate(-50%, -50%);
      width: min(760px, calc(100vw - 2rem));
      max-height: min(88vh, 820px);
      overflow: auto;
      z-index: 901;
      margin: 0;
      box-shadow: 0 24px 80px rgba(15, 39, 68, 0.28);
      border: 1px solid rgba(255,255,255,.7);
    }
    #form-card.gallery-modal .gallery-modal-close {
      position: absolute;
      top: .85rem;
      right: .85rem;
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 999px;
      background: var(--gray-100);
      color: var(--gray-700);
      font-size: 1.25rem;
      cursor: pointer;
    }
    @media (max-width: 640px) {
      #form-card.gallery-modal {
        width: calc(100vw - 1rem);
        max-height: calc(100vh - 1rem);
      }
    }
  </style>
</head>
<body>
  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="logo"><img src="../assets/images/logo-insta.jpeg" alt="" style="height:48px;border-radius:10px;object-fit:contain;"><div class="logo-text" style="color:white;">MAGIA GLASS<span style="color:rgba(255,255,255,0.6);">ADMIN</span></div></div>
      <nav class="admin-nav">
        <a href="dashboard.html">📊 Dashboard</a><a href="home.html">🏠 Editar Home</a><a href="services.html">🛠️ Serviços</a><a href="gallery.html" class="active">🖼️ Galeria</a><a href="marketing.html">📢 Marketing</a><a href="settings.html">⚙️ Configurações</a><a href="password.html">🔑 Alterar Senha</a><a href="../index.html" target="_blank">🌐 Ver Site</a><a href="#" onclick="logout(); location.href='index.html';">🚪 Sair</a>
      </nav>
    </aside>
    <main class="admin-main">
      <div class="admin-header"><h1 style="font-family:var(--font-display);">Galeria de Publicações (álbuns)</h1><button class="btn btn-primary btn-sm" onclick="showForm()">+ Novo Item</button></div>
      <div class="admin-card gallery-modal" id="form-card" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="form-title">
        <button type="button" class="gallery-modal-close" aria-label="Fechar editor" onclick="hideForm()">×</button>
        <h3 id="form-title" style="padding-right:3rem;">Novo Item na Galeria</h3>
        <form id="gallery-form">
          <input type="hidden" id="g-id"><div class="form-group"><label>Título</label><input type="text" id="g-title" class="form-control" required></div><div class="form-group"><label>Descrição</label><textarea id="g-description" class="form-control" rows="2"></textarea></div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;"><div class="form-group"><label>Categoria</label><input type="text" id="g-category" class="form-control" placeholder="Ex: Box"></div><div class="form-group"><label>Data</label><input type="date" id="g-date" class="form-control"></div></div>
          <div class="form-group"><label>Imagens (até 5 por publicação)</label><input type="file" id="g-images" class="form-control" accept="image/*" multiple><p style="font-size:0.8rem;color:var(--gray-600);margin-top:0.35rem;">Selecione até 5 fotos. As imagens são validadas, otimizadas e enviadas ao Vercel Blob.</p><div id="g-previews" style="display:flex;flex-wrap:wrap;gap:0.75rem;margin-top:0.75rem;"></div></div>
          <div class="form-group"><label><input type="checkbox" id="g-featured"> Destaque</label></div><div style="display:flex;gap:0.75rem;"><button type="submit" class="btn btn-primary" id="gallery-save-btn">Salvar</button><button type="button" class="btn btn-secondary" onclick="hideForm()">Cancelar</button></div>
        </form>
      </div>
      <div class="admin-card"><div class="gallery-grid" id="gallery-list" style="grid-template-columns:repeat(auto-fill,minmax(240px,1fr));"></div></div>
    </main>
  </div>
  <script src="../assets/js/data.js"></script>
  <script>
    if (!isAuthenticated()) location.href = 'index.html';
    let currentImages = [];
    let originalImages = [];
    let pendingFiles = [];
    const MAX_IMAGES = 5;

    function previewFile(file) {
      return URL.createObjectURL(file);
    }

    function renderPreviews() {
      const el = document.getElementById('g-previews');
      el.innerHTML = currentImages.map((src, i) => `<div style="position:relative;width:90px;height:90px;"><img src="${src}" alt="" style="width:90px;height:90px;object-fit:cover;border-radius:8px;"><button type="button" onclick="removeImg(${i})" style="position:absolute;top:-6px;right:-6px;background:#e53e3e;color:#fff;border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:12px;">×</button></div>`).join('');
      pendingFiles.forEach((file, i) => {
        const src = previewFile(file);
        const wrapper = document.createElement('div');
        wrapper.style.cssText = 'position:relative;width:90px;height:90px;';
        wrapper.innerHTML = `<img src="${src}" alt="" style="width:90px;height:90px;object-fit:cover;border-radius:8px;"><button type="button" style="position:absolute;top:-6px;right:-6px;background:#e53e3e;color:#fff;border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:12px;">×</button>`;
        wrapper.querySelector('button').onclick = () => { pendingFiles.splice(i, 1); renderPreviews(); };
        el.appendChild(wrapper);
      });
    }

    function removeImg(i) { currentImages.splice(i, 1); renderPreviews(); }

    document.getElementById('g-images').addEventListener('change', e => {
      const files = Array.from(e.target.files || []).filter(file => file.type.startsWith('image/'));
      const remaining = MAX_IMAGES - currentImages.length - pendingFiles.length;
      if (files.length > remaining) {
        alert('Cada publicação pode ter no máximo 5 imagens.');
        e.target.value = '';
        return;
      }
      pendingFiles.push(...files);
      e.target.value = '';
      renderPreviews();
    });

    function load() {
      const list = getData(STORAGE_KEYS.gallery, DEFAULT_GALLERY).sort((a,b)=>new Date(b.date)-new Date(a.date));
      document.getElementById('gallery-list').innerHTML = list.map(item => {
        const imgs = (item.images && item.images.length) ? item.images : (item.image ? [item.image] : []); const cover = imgs[0] || '../assets/images/logo-insta.jpeg';
        return `<div class="glass" style="overflow:hidden;"><div style="position:relative;"><img src="${cover}" alt="${item.title || 'Imagem da galeria'}" style="width:100%;height:150px;object-fit:cover;" onerror="this.src='../assets/images/logo-insta.jpeg'">${imgs.length > 1 ? '<span style="position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.7);color:#fff;font-size:0.75rem;padding:2px 8px;border-radius:999px;">' + imgs.length + ' fotos</span>' : ''}</div><div style="padding:1rem;"><strong>${item.title}</strong><p style="font-size:0.85rem;color:var(--gray-600);margin:0.25rem 0;">${item.category || ''} · ${item.date || ''}</p><div style="display:flex;gap:0.5rem;margin-top:0.5rem;"><button class="btn btn-sm btn-secondary" data-edit-id="${item.id}">Editar</button><button class="btn btn-sm btn-outline" data-del-id="${item.id}">Excluir</button></div></div></div>`;
      }).join('') || '<p>Nenhum item ainda. Clique em + Novo Item.</p>';
    }

    function showForm() {
      document.body.classList.add('gallery-modal-open');
      document.getElementById('form-card').style.display = 'block';
      document.getElementById('form-title').textContent = 'Novo Item';
      document.getElementById('gallery-form').reset();
      document.getElementById('g-id').value = '';
      currentImages = [];
      originalImages = [];
      pendingFiles = [];
      renderPreviews();
      document.getElementById('g-date').value = new Date().toISOString().slice(0,10);
    }

    function hideForm() {
      document.getElementById('form-card').style.display = 'none';
      document.body.classList.remove('gallery-modal-open');
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && document.body.classList.contains('gallery-modal-open')) hideForm();
    });

    function editItemById(id) {
      const list = getData(STORAGE_KEYS.gallery, DEFAULT_GALLERY); const item = list.find(i => i.id === id);
      if (!item) { alert('Item não encontrado.'); return; }
      showForm();
      document.getElementById('form-title').textContent = 'Editar Item';
      document.getElementById('g-id').value = item.id;
      document.getElementById('g-title').value = item.title || '';
      document.getElementById('g-description').value = item.description || '';
      document.getElementById('g-category').value = item.category || '';
      document.getElementById('g-date').value = item.date || '';
      document.getElementById('g-featured').checked = !!item.featured;
      currentImages = ((item.images && item.images.length) ? item.images.slice() : (item.image ? [item.image] : [])).slice(0, MAX_IMAGES);
      originalImages = currentImages.slice();
      pendingFiles = [];
      renderPreviews();
    }

    async function uploadPendingFiles(title) {
      const uploaded = [];
      for (const file of pendingFiles) {
        const form = new FormData();
        form.append('file', file);
        form.append('purpose', 'gallery');
        form.append('altText', title || 'Imagem da galeria Magia Glass');
        const response = await fetch('/api/media', { method: 'POST', credentials: 'include', body: form });
        const payload = await response.json().catch(() => ({}));
        if (!response.ok || !payload.ok || !payload.url) {
          throw new Error(payload.error || 'Não foi possível enviar uma das imagens.');
        }
        uploaded.push(payload.url);
      }
      return uploaded;
    }

    async function deleteRemovedMedia(previousImages, nextImages) {
      const removed = previousImages.filter(url => /^https:\/\//.test(url) && !nextImages.includes(url));
      for (const url of removed) {
        try {
          await fetch('/api/media', { method: 'DELETE', credentials: 'include', headers: {'Content-Type':'application/json'}, body: JSON.stringify({url}) });
        } catch (_) {}
      }
    }

    function deleteItem(id) {
      if (!confirm('Excluir este item?')) return;
      let list = getData(STORAGE_KEYS.gallery, []);
      const removed = list.find(i => i.id === id);
      list = list.filter(i => i.id !== id);
      if (!setData(STORAGE_KEYS.gallery, list)) return;
      const oldImages = removed ? ((removed.images && removed.images.length) ? removed.images : (removed.image ? [removed.image] : [])) : [];
      deleteRemovedMedia(oldImages, []).finally(load);
    }

    document.getElementById('gallery-form').addEventListener('submit', async e => {
      e.preventDefault();
      const saveBtn = document.getElementById('gallery-save-btn');
      saveBtn.disabled = true;
      saveBtn.textContent = 'Enviando...';
      try {
        const title = document.getElementById('g-title').value.trim();
        const uploaded = await uploadPendingFiles(title);
        const nextImages = [...currentImages, ...uploaded].slice(0, MAX_IMAGES);
        if (!nextImages.length && !confirm('Nenhuma imagem adicionada. Salvar mesmo assim?')) return;

        let list = getData(STORAGE_KEYS.gallery, []);
        const id = document.getElementById('g-id').value || ('g' + Date.now());
        const item = {
          id,
          title,
          description: document.getElementById('g-description').value.trim(),
          category: document.getElementById('g-category').value.trim(),
          date: document.getElementById('g-date').value,
          featured: document.getElementById('g-featured').checked,
          images: nextImages,
          image: nextImages[0] || ''
        };
        const idx = list.findIndex(i => i.id === id);
        if (idx >= 0) list[idx] = item; else list.push(item);
        if (!setData(STORAGE_KEYS.gallery, list)) return;

        await deleteRemovedMedia(originalImages, nextImages);
        hideForm();
        load();
        alert('Publicação salva com ' + nextImages.length + ' imagem(ns)!');
      } catch (err) {
        alert(err.message || 'Não foi possível salvar a publicação.');
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Salvar';
      }
    });

    function bindListActions() {
      document.getElementById('gallery-list').onclick = function(e) {
        const editBtn = e.target.closest('[data-edit-id]');
        const delBtn = e.target.closest('[data-del-id]');
        if (editBtn) editItemById(editBtn.getAttribute('data-edit-id'));
        if (delBtn) deleteItem(delBtn.getAttribute('data-del-id'));
      };
    }

    load();
    bindListActions();
  </script>
</body>
</html>
